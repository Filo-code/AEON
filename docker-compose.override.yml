# AEON by Rekt - Docker Compose Override
# This file is generated by the installer and should NOT be edited manually.
# It extends the base docker-compose.yml with AEON-specific configuration.
# The base docker-compose.yml remains immutable.

services:
  bot:
    container_name: aeon-bot
    networks:
      - aeon-network
    environment:
      - DATA_DIR=/app/data
      - DASHBOARD_HEALTH_URL=http://dashboard:8080/healthz
      - DASHBOARD_SCREENSHOT_URL=http://dashboard:8080

  dashboard:
    container_name: aeon-dashboard
    networks:
      - aeon-network
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data

  caddy:
    container_name: aeon-caddy
    profiles: ["https"]
    networks:
      - aeon-network
    volumes:
      - aeon_caddy_data:/data
      - aeon_caddy_config:/config

  cloudflared:
    container_name: aeon-tunnel
    profiles: ["tunnel"]
    networks:
      - aeon-network

  autoheal:
    container_name: aeon-autoheal
    profiles: ["autoheal"]

networks:
  aeon-network:
    driver: bridge
    name: aeon-network

volumes:
  aeon_caddy_data:
  aeon_caddy_config: